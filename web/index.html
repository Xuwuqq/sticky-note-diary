<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>便签日记</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div id="app">
  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-icon">📒</span>
      <span class="brand-name">便签日记</span>
      <button class="icon-btn sidebar-close" id="btnSidebarClose" title="收起侧边栏">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <button class="btn-primary" id="btnNew">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建日志
    </button>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="all">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>
        <span class="nav-label">全部日志</span><span class="nav-count" id="cntAll">0</span>
      </button>
      <button class="nav-item" data-view="pinned">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3H7l3-3-1-6z"/></svg>
        <span class="nav-label">置顶</span><span class="nav-count" id="cntPinned">0</span>
      </button>
      <button class="nav-item" data-view="trash">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        <span class="nav-label">回收站</span><span class="nav-count" id="cntTrash">0</span>
      </button>
    </nav>
    <div class="side-label" id="tagLabel">标签</div>
    <div class="tag-list" id="tagList"></div>
    <div class="side-footer">
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <span class="ver">v1.0 · 便携版</span>
    </div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <main class="main">
    <div class="sidebar-mask" id="sidebarMask"></div>
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="btnMenu" title="菜单">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="搜索标题、内容、标签…" autocomplete="off">
      </div>
      <select id="sortSelect" class="select" title="排序方式">
        <option value="updated">最近更新</option>
        <option value="created">创建时间</option>
        <option value="title">标题</option>
      </select>
      <button class="icon-btn" id="btnTheme" title="切换深浅主题"></button>
    </header>
    <section class="notes-grid" id="grid"></section>
    <div class="empty hidden" id="emptyState">
      <div class="empty-icon">🗒️</div>
      <div class="empty-text" id="emptyText">这里还没有日志</div>
      <button class="btn-primary sm" id="btnEmptyNew">新建第一篇日志</button>
    </div>
  </main>
</div>

<!-- ============ 编辑器 ============ -->
<div class="overlay hidden" id="editor">
  <div class="editor-shell" id="editorShell">
    <div class="editor-top">
      <button class="icon-btn" id="btnBack" title="返回 (Esc)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <input id="editorTitle" class="title-input" placeholder="无标题日志" maxlength="100" autocomplete="off">
      <span class="save-status" id="saveStatus">已保存</span>
      <span class="word-count" id="wordCount">0 字</span>
      <button class="icon-btn text-btn" id="fontDec" title="缩小字号">A-</button>
      <button class="icon-btn text-btn" id="fontInc" title="放大字号">A+</button>
      <button class="icon-btn" id="btnMore" title="更多操作">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
    </div>
    <div class="editor-meta">
      <div class="tag-box" id="tagBox"></div>
      <div class="meta-right">
        <div class="mood-box" id="moodBox"></div>
        <div class="color-box" id="colorBox"></div>
      </div>
    </div>
    <div class="toolbar" id="toolbar"></div>
    <div class="editor-scroll" id="editorScroll">
      <div class="editor-content" id="editorContent" contenteditable="true" data-placeholder="开始记录今天的一切…" spellcheck="false"></div>
    </div>
    <div class="editor-status" id="editorStatus"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast hidden" id="toast"></div>
<input type="file" id="filePicker" hidden>
<script>const TOKEN = "__TOKEN__";</script>
<script src="/web/app.js"></script>
</body>
</html>
